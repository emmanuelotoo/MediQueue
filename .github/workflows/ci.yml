name: CI

on:
  # Every branch, so a change is proven before it reaches main, where Heroku
  # deploys only after these checks pass.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MediQueue.slnx

      - name: Build
        run: dotnet build MediQueue.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MediQueue.slnx --configuration Release --no-build --logger GitHubActions

      # GITHUB_PATH takes effect from the next step, hence two steps.
      - name: Install EF tools
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # A model change without a matching migration would fail on deploy, not here.
      - name: Check migrations match the model
        run: |
          dotnet ef migrations has-pending-model-changes --project src/MediQueue.Infrastructure --context SqliteMediQueueDbContext --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes --project src/MediQueue.Infrastructure --context PostgresMediQueueDbContext --configuration Release --no-build

  postgres:
    name: API tests (Postgres)
    runs-on: ubuntu-latest

    # Production runs on Postgres, and no developer machine is required to have
    # it, so this job is where the Postgres migration and queries are proven.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mediqueue
          POSTGRES_PASSWORD: mediqueue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediqueue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MEDIQUEUE_TEST_POSTGRES: Host=localhost;Port=5432;Username=mediqueue;Password=mediqueue

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the API against Postgres
        run: dotnet test tests/MediQueue.Api.Tests --configuration Release --logger GitHubActions

  heroku:
    name: Heroku build rehearsal
    runs-on: ubuntu-latest

    # Repeats what Heroku's .NET buildpack does with this repository, so a
    # deploy build that would fail on Heroku fails here first, and Heroku's
    # "wait for CI" holds it back.
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The buildpack accepts only a .sln or .slnx file name in the repository root.
      - name: Check project.toml names a root solution file
        id: solution
        run: |
          file=$(sed -n 's/^solution_file = "\(.*\)"$/\1/p' project.toml)
          case "$file" in
            */* | "") echo "::error file=project.toml::solution_file must be a file name in the repository root"; exit 1 ;;
            *.sln | *.slnx) ;;
            *) echo "::error file=project.toml::solution_file must be a .sln or .slnx file"; exit 1 ;;
          esac
          test -f "$file" || { echo "::error file=project.toml::$file does not exist"; exit 1; }
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # The buildpack's exact command (dotnet_sdk_command.rs in heroku/buildpacks-dotnet).
      - name: Publish as the buildpack does
        run: dotnet publish "${{ steps.solution.outputs.file }}" --runtime linux-x64 -p:PublishDir=bin/publish --artifacts-path "$RUNNER_TEMP/build_artifacts"

      - name: Check every project was built in Release
        run: |
          debug=$(find "$RUNNER_TEMP/build_artifacts/bin" -mindepth 2 -maxdepth 2 -type d -name 'debug*')
          if [ -n "$debug" ]; then echo "::error::Built in Debug: $debug"; exit 1; fi

      - name: Check the executable the Procfile runs exists
        run: test -x src/MediQueue.Api/bin/publish/MediQueue.Api
