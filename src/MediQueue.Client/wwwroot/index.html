<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MediQueue</title>
    <meta name="description" content="Outpatient registration and live queue management." />
    <meta name="theme-color" content="#0d6560" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071618" media="(prefers-color-scheme: dark)" />
    <base href="/" />
    <link rel="preload" href="fonts/archivo-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/plex-mono-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MediQueue.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot__mark">MediQueue</div>
            <div class="boot__bar"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. <a href="." class="reload">Reload</a>
        <span class="dismiss">&#128473;</span>
    </div>

    <style>
        /* Inlined so the first paint is branded rather than a blank page. */
        .boot {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            background: #f4f1eb;
            color: #14211f;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .boot__mark {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .boot__bar {
            width: 9rem;
            height: 2px;
            overflow: hidden;
            background: #ddd7cc;
        }

        .boot__bar span {
            display: block;
            width: 40%;
            height: 100%;
            background: #0d6560;
            animation: boot-slide 1.1s ease-in-out infinite;
        }

        @keyframes boot-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        @media (prefers-color-scheme: dark) {
            .boot { background: #071618; color: #e6efec; }
            .boot__bar { background: #1c3d41; }
            .boot__bar span { background: #3fb0a5; }
        }
    </style>

    <!-- The stable address; the server maps it to the fingerprinted file. -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
