services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in a .env file}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The API migrates on startup, so it must not race the server's boot.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__Default: >-
        Server=db,1433;Database=MediQueue;User Id=sa;
        Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      # Required outside Development; there is no fallback in production.
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in a .env file}
      # Demo patients stay out of anything resembling a real deployment.
      Seed__DemoData: "false"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"

volumes:
  mssql-data:
