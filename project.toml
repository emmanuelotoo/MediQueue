# Heroku's .NET buildpack publishes the solution named here, which must be a
# file in the repository root. MediQueue.Heroku.slnx lists only the API: the
# whole MediQueue.slnx would ship the test projects and build the Blazor client
# twice at once, which fails intermittently.
[_]
schema-version = "0.2"

[com.heroku.buildpacks.dotnet]
solution_file = "MediQueue.Heroku.slnx"
